name: Build mobile

# Builds de plataforma sao manuais (e iOS tambem agendado) por custo.
# Sem .env/segredos: o app compila e mostra a tela "configure o Firebase".
on:
  workflow_dispatch:
    inputs:
      android:
        description: "Compilar Android (apk debug)"
        type: boolean
        default: false
      ios:
        description: "Compilar iOS (--no-codesign)"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1" # semanal, segunda 06:00 UTC (somente iOS)

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  android:
    name: Android (debug)
    if: github.event_name == 'workflow_dispatch' && inputs.android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  ios:
    name: iOS (no-codesign)
    if: github.event_name == 'schedule' || inputs.ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
