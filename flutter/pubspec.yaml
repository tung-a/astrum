name: astrum
description: Astrum — astrologia, tarot e espiritualidade em Flutter.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  flutter_markdown: ^0.7.4+3
  flutter_tts: ^4.2.0
  uuid: ^4.5.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
